<VirtualHost *:80>
    # Dossier racine du site
    DocumentRoot /var/www/html

    # Options du dossier
    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Securite : bloquer l'acces direct aux dossiers sensibles
    <Directory /var/www/html/src>
        Require all denied
    </Directory>
    <Directory /var/www/html/vendor>
        Require all denied
    </Directory>
    <Directory /var/www/html/templates>
        Require all denied
    </Directory>

    # Cache statique (images, CSS, JS, polices) — 1 mois
    <LocationMatch "\.(css|js|jpg|jpeg|png|gif|svg|ico|woff2?|ttf|eot|webp|avif)$">
        ExpiresActive On
        ExpiresDefault "access plus 1 month"
        Header set Cache-Control "public, max-age=2592000, immutable"
    </LocationMatch>

    # Logs
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
