<VirtualHost *:80>
    DocumentRoot /var/www/html

    # Options du dossier
    <Directory /var/www/html>
        # Désactive l'affichage de la liste des fichiers et autorise les liens symboliques
        Options -Indexes +FollowSymLinks
        # Autorise l'utilisation des fichiers .htaccess pour surcharger la configuration
        AllowOverride All
        # Autorise l'accès public au répertoire racine
        Require all granted
    </Directory>

    # Securite : bloquer l'acces direct aux dossiers sensibles
    <Directory /var/www/html/src>
        # Interdit tout accès externe au dossier des sources
        Require all denied
    </Directory>
    <Directory /var/www/html/vendor>
        # Interdit l'accès au dossier des dépendances (Composer)
        Require all denied
    </Directory>
    <Directory /var/www/html/templates>
        # Interdit l'accès aux fichiers de vue/templates
        Require all denied
    </Directory>

    # Cache statique (images, CSS, JS, polices) — 1 mois
    <LocationMatch "\.(css|js|jpg|jpeg|png|gif|svg|ico|woff2?|ttf|eot|webp|avif)$">
        # Active le module d'expiration
        ExpiresActive On
        # Définit la durée de rétention dans le cache du navigateur à 1 mois
        ExpiresDefault "access plus 1 month"
        # Ajoute l'en-tête HTTP pour forcer la mise en cache publique et immuable
        Header set Cache-Control "public, max-age=2592000, immutable"
    </LocationMatch>

    # Chemin vers le fichier de log des erreurs
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>