<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="../assets/Logo rouge head.png">
    <title>Ajouter un pilote — CesiTonJob</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../css/Création.css" />
    <style> :root {--accent: #bd0000;}</style>
  </head>
  <body class="pilote">
    <main class="page">
      <section class="card">
        <a href="javascript:history.back()" class="btn-back">
          <i class="fa-solid fa-arrow-left"></i>
        </a>

        <img class="logo" id="logo" src="../assets/Logo rouge cesiTonJob.svg?v=1" alt="Logo CesiTonJob" />
        <h1 class="title">Ajouter un pilote</h1>

        <form class="add-form" action="#" method="post" novalidate>
            <div class="intro">
                <div class="upload-container">
                    <label for="file-upload" class="upload-label">
                        <div class="upload-circle">
                            <span class="plus-sign">+</span>
                        </div>
                        <span class="upload-text">ajouter une photo</span>
                    </label>
                    <input id="file-upload" type="file" accept="image/*" style="display: none;">
                </div>
                <div class="main-info">
                    <label>
                        <span class="label-text">Nom</span>
                        <input type="text" name="lastname" placeholder="Nom..." required />
                    </label>
                    <label>
                        <span class="label-text">Prénom</span>
                        <input type="text" name="firstname" placeholder="Prénom..." required />
                    </label>
                </div>
            </div>
          <label>
            <span class="label-text">Adresse mail</span>
            <input type="email" name="email" placeholder="Adresse mail..." required />
          </label>
          <label>
            <span class="label-text">Téléphone</span>
            <input type="tel" name="phone" placeholder="Téléphone..." />
          </label>
          <label>
            <span class="label-text">Ville</span>
            <div class="search-container">
              <input type="text" id="ville-input" placeholder="Ville..." autocomplete="off">
              <div class="select-items" id="lieu-options">
                <div class="select-option-search" data-value="rouen">Rouen</div>
                <div class="select-option-search" data-value="paris">Paris</div>
                <div class="select-option-search" data-value="lyon">Lyon</div>
                <div class="select-option-search" data-value="marseille">Marseille</div>
                <div class="select-option-search" data-value="lille">Lille</div>
                <div class="select-option-search" data-value="bordeaux">Bordeaux</div>
                <div class="select-option-search" data-value="toulouse">Toulouse</div>
                <div class="select-option-search" data-value="nantes">Nantes</div>
                <div class="select-option-search" data-value="strasbourg">Strasbourg</div>
                <div class="select-option-search" data-value="nice">Nice</div>
              </div>
              <input type="hidden" name="ville" class="select-hidden">
            </div>
          </label>
          <label>
            <span class="label-text">Promotion</span>
            <input type="text" name="promotion" placeholder="Promotion..." />
          </label>

          <button class="primary" type="submit">Ajouter</button>
        </form>
      </section>
    </main>
    <script src="../js/Creation.js"></script>
    <script src="../js/UploadImg.js"></script>
  </body>
</html>
