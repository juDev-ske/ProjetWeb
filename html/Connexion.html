<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Se connecter — CesiTonJob</title>
    <link rel="stylesheet" href="css/Connexion.css?v=1" />
  </head>
  <body class="pilote">
    <main class="page">
      <section class="card">
        <img class="logo" id="logo" src="assets/images/Logo vert cesiTonJob.svg?v=1" alt="Logo CesiTonJob" />
        <h1 class="title">Se Connecter</h1>

        <nav class="role-switch" aria-label="Choisir rôle">
          <button type="button" class="role active" data-role="pilote" data-logo="assets/images/Logo vert cesiTonJob.svg?v=1">Pilote</button>
          <button type="button" class="role" data-role="etudiant" data-logo="assets/images/Logo bleu cesiTonJob.svg?v=1">Étudiant</button>
        </nav>

        <form class="login-form" action="#" method="post" novalidate>
          <label>
            <span class="label-text">Adresse mail</span>
            <input type="email" name="email" placeholder="Adresse mail..." required />
          </label>

          <label class="password-row">
            <span class="label-text">Mot de passe</span>
            <div class="pw-wrap">
              <input type="password" name="password" id="pw" placeholder="Mot de passe..." required />
              <button class="eye-btn" type="button" onclick="togglePw()" aria-label="Afficher">
                <svg id="eye" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="3"/>
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/>
                </svg>
              </button>
            </div>
          </label>

          <div class="form-meta">
            <div class="toggle-row">
              <span class="toggle-label">Rester connecté·e</span>
              <label class="toggle">
                <input type="checkbox" name="remember" />
                <span class="track"></span>
              </label>
            </div>
            <a class="forgot" href="#">Mot de passe oublié</a>
          </div>

          <button class="primary" type="submit">Je me connecte</button>
        </form>
      </section>
    </main>
    <script>
      (function(){
        // Cache-bust using a timestamp so browser fetches latest CSS and logos
        const cacheBust = Date.now();
        const cssLink = document.querySelector('link[rel="stylesheet"][href*="styles.css"]');
        if(cssLink){
          cssLink.href = 'css/styles.css?v=' + cacheBust;
        }

        const roles = document.querySelectorAll('.role-switch .role');
        const logo = document.querySelector('.logo');
        function setRole(role){
          document.body.classList.remove('pilote','etudiant');
          document.body.classList.add(role);
          roles.forEach(btn => btn.classList.toggle('active', btn.dataset.role === role));
          const btn = Array.from(roles).find(b => b.dataset.role === role);
          if(btn && btn.dataset.logo){
            const base = btn.dataset.logo.split('?')[0];
            logo.src = base + '?v=' + cacheBust;
          }
        }
        roles.forEach(btn => {
          btn.addEventListener('click', () => setRole(btn.dataset.role));
        });
        const activeBtn = document.querySelector('.role-switch .role.active');
        if(activeBtn) setRole(activeBtn.dataset.role);
      })();
    </script>
    <script>
      let shownPw = false;
      function togglePw() {
        shownPw = !shownPw;
        const pw = document.getElementById('pw');
        const eye = document.getElementById('eye');
        if(!pw || !eye) return;
        pw.type = shownPw ? 'text' : 'password';
        eye.innerHTML = shownPw
          ? `<path d="M17.94 17.94A10 10 0 0 1 12 20c-7 0-11-8-11-8a18 18 0 0 1 5.06-5.94M9.9 4.24A9 9 0 0 1 12 4c7 0 11 8 11 8a18 18 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>`
          : `<circle cx="12" cy="12" r="3"/><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/>`;
      }
    </script>
  </body>
</html>
