version: '3.8'

services:

  web:
    build:
      context: .                 
      dockerfile: docker/php/Dockerfile
    ports:
      - "8080:80"        
    volumes:
      - ./www:/var/www/html 
    depends_on:
      - db                   
  
  db:
    image: mysql:8.0           
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: monsite
      MYSQL_USER: user
      MYSQL_PASSWORD: userpass
    volumes:
      - db_data:/var/lib/mysql 

volumes:
  db_data:                      
